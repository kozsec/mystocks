name: Update stock prices

on:
  push:
    paths:
      - "data/holdings.json"
      - "scripts/update_stock.py"
  schedule:
    - cron: "0 7,9,12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stock-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install yfinance

      - name: Update stock data
        run: python scripts/update_stock.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/history.json data/portfolio_history.json
          if git diff --cached --quiet; then
            echo "No stock data changes."
          else
            git commit -m "Update stock price data"
            git push
          fi
